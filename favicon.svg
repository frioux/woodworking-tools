  <path d="M4 11 Q16 9 28 11" stroke="#8b5e2a" stroke-width="0.8" fill="none"/>
  <path d="M4 15 Q12 13.5 20 14.5 Q24 15 28 14" stroke="#8b5e2a" stroke-width="0.7" fill="none"/>
  <path d="M4 19 Q10 17.5 18 18.5 Q24 19.5 28 18" stroke="#8b5e2a" stroke-width="0.8" fill="none"/>
  <path d="M4 23 Q14 21 28 22.5" stroke="#8b5e2a" stroke-width="0.6" fill="none"/>
  <!-- Knot -->
  <ellipse cx="20" cy="16" rx="2.2" ry="1.8" fill="#8b5e2a"/>
