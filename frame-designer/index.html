<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Frame Designer - Woodworking Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../index.html">&larr; All Tools</a>
    <h1>Picture Frame Designer</h1>
  </header>

  <div class="layout">
    <!-- Input form -->
    <section class="form-panel">
      <h2>Dimensions (inches)</h2>

      <div class="form-group">
        <label for="canvas-width">Canvas width</label>
        <div class="input-row">
          <input type="number" id="canvas-width" value="16" min="0.1" step="0.0625">
          <span class="imperial" data-for="canvas-width"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="canvas-height">Canvas height</label>
        <div class="input-row">
          <input type="number" id="canvas-height" value="20" min="0.1" step="0.0625">
          <span class="imperial" data-for="canvas-height"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="image-width">Image width (visible)</label>
        <div class="input-row">
          <input type="number" id="image-width" value="10" min="0.1" step="0.0625">
          <span class="imperial" data-for="image-width"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="top-margin">Top margin (mat)</label>
        <div class="input-row">
          <input type="number" id="top-margin" value="3" min="0" step="0.0625">
          <span class="imperial" data-for="top-margin"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="bottom-margin">Bottom margin (mat)</label>
        <div class="input-row">
          <input type="number" id="bottom-margin" value="4" min="0" step="0.0625">
          <span class="imperial" data-for="bottom-margin"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="frame-width">Frame molding width</label>
        <div class="input-row">
          <input type="number" id="frame-width" value="1.5" min="0.25" step="0.0625">
          <span class="imperial" data-for="frame-width"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="frame-depth">Frame molding depth</label>
        <div class="input-row">
          <input type="number" id="frame-depth" value="0.75" min="0.25" step="0.0625">
          <span class="imperial" data-for="frame-depth"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="glass-depth">Glass depth</label>
        <div class="input-row">
          <input type="number" id="glass-depth" value="0.125" min="0" step="0.0625">
          <span class="imperial" data-for="glass-depth"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="backer-depth">Backer depth</label>
        <div class="input-row">
          <input type="number" id="backer-depth" value="0.125" min="0" step="0.0625">
          <span class="imperial" data-for="backer-depth"></span>
        </div>
      </div>
    </section>

    <!-- Cut list and derived values -->
    <section class="cut-list" id="cut-list">
      <h2>Cut List &amp; Dimensions</h2>
      <div id="cut-list-content"></div>
    </section>

    <!-- Diagram area -->
    <section class="diagrams">
      <div class="diagram-card">
        <h3>Front View</h3>
        <div id="diagram-front"></div>
      </div>
      <div class="diagram-card">
        <h3>Top Cross-Section</h3>
        <div id="diagram-top"></div>
      </div>
      <div class="diagram-card">
        <h3>Side Cross-Section</h3>
        <div id="diagram-side"></div>
      </div>
      <div class="diagram-card">
        <h3>Isometric View</h3>
        <div id="diagram-iso"></div>
      </div>
    </section>
  </div>

  <script type="module" src="frame-ui.js"></script>
</body>
</html>
