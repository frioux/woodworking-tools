<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Frame Designer - Woodworking Tools</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../index.html">&larr; All Tools</a>
    <h1>Picture Frame Designer</h1>
  </header>

  <div class="layout">
    <!-- Input form -->
    <section class="form-panel">
      <h2>Dimensions (inches)</h2>

      <div class="form-group">
        <label for="canvas-width">Canvas width <span class="validation-error" id="error-canvas-width"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="canvas-width" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="canvas-width" value="12" min="0.0625" step="0.0625">
          <button type="button" class="stepper" data-for="canvas-width" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="canvas-width"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="canvas-height">Canvas height <span class="validation-error" id="error-canvas-height"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="canvas-height" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="canvas-height" value="18" min="0.0625" step="0.0625">
          <button type="button" class="stepper" data-for="canvas-height" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="canvas-height"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="image-width">Image width (visible) <span class="validation-error" id="error-image-width"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="image-width" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="image-width" value="10" min="0.0625" step="0.0625">
          <button type="button" class="stepper" data-for="image-width" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="image-width"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="top-margin">Top margin <span class="validation-error" id="error-top-margin"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="top-margin" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="top-margin" value="0.125" min="0" step="0.0625">
          <button type="button" class="stepper" data-for="top-margin" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="top-margin"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="bottom-margin">Bottom margin <span class="validation-error" id="error-bottom-margin"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="bottom-margin" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="bottom-margin" value="0.125" min="0" step="0.0625">
          <button type="button" class="stepper" data-for="bottom-margin" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="bottom-margin"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="frame-width">Frame molding width <span class="validation-error" id="error-frame-width"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="frame-width" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="frame-width" value="1.25" min="0.25" step="0.0625">
          <button type="button" class="stepper" data-for="frame-width" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="frame-width"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="frame-depth">Frame molding depth <span class="validation-error" id="error-frame-depth"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="frame-depth" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="frame-depth" value="1" min="0.25" step="0.0625">
          <button type="button" class="stepper" data-for="frame-depth" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="frame-depth"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="glass-depth">Glass depth <span class="validation-error" id="error-glass-depth"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="glass-depth" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="glass-depth" value="0.125" min="0" step="0.0625">
          <button type="button" class="stepper" data-for="glass-depth" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="glass-depth"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="backer-depth">Backer depth <span class="validation-error" id="error-backer-depth"></span></label>
        <div class="input-row">
          <button type="button" class="stepper" data-for="backer-depth" data-dir="down" aria-label="Decrease">&minus;</button>
          <input type="number" id="backer-depth" value="0.125" min="0" step="0.0625">
          <button type="button" class="stepper" data-for="backer-depth" data-dir="up" aria-label="Increase">+</button>
          <span class="imperial" data-for="backer-depth"></span>
        </div>
      </div>
    </section>

    <!-- Cut list and derived values -->
    <section class="cut-list" id="cut-list">
      <h2>Cut List</h2>
      <div id="cut-list-content"></div>
    </section>

    <!-- Diagram area -->
    <section class="diagrams">
      <div class="diagram-card">
        <h3>Front View</h3>
        <div id="diagram-front"></div>
      </div>
      <div class="diagram-card">
        <h3>Top Cross-Section</h3>
        <div id="diagram-top"></div>
      </div>
      <div class="diagram-card">
        <h3>Side Cross-Section</h3>
        <div id="diagram-side"></div>
      </div>
      <div class="diagram-card">
        <h3>Isometric View</h3>
        <div id="diagram-iso"></div>
      </div>
    </section>
  </div>

  <script type="module" src="frame-ui.js"></script>
</body>
</html>
